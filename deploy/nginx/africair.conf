log_format africair_json escape=json
  '{"time_iso8601":"$time_iso8601","time_local":"$time_local",'
  '"remote_addr":"$remote_addr","request_method":"$request_method",'
  '"request_uri":"$request_uri","status":$status,'
  '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"time_epoch":$msec,'
  '"http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/africair/current;
    index index.html;
    access_log /var/log/nginx/africair.access.json africair_json;

    include /etc/nginx/snippets/africair-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/snippets/africair-origin-auth.conf;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/africair-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/africair-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /version.json {
        include /etc/nginx/snippets/africair-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
